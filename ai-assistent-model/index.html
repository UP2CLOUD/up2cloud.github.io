<!doctype html>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-JVQKLM1R3Q"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-JVQKLM1R3Q');
  </script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="UP2CLOUD AI Cloud Engineering Assistant for architecture, DevOps, FinOps, security and infrastructure guidance.">
  <title>UP2CLOUD AI Cloud Engineering Assistant</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #07111f;
      color: #edf5ff;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; min-height: 100%; margin: 0; }
    body { background: #07111f; }
    .bar {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 10px clamp(16px, 4vw, 36px);
      border-bottom: 1px solid rgba(148, 175, 207, .18);
      background: #07111f;
    }
    .brand { display: flex; align-items: center; gap: 10px; font-weight: 800; letter-spacing: .02em; }
    .mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, #4d9fff, #2563eb);
    }
    .back { color: #9bc9ff; text-decoration: none; font-size: .9rem; font-weight: 700; }
    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 58px);
      border: 0;
      background: #07111f;
    }
    .fallback {
      position: fixed;
      inset: 58px 0 0;
      z-index: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #9bb0c9;
      text-align: center;
    }
    .fallback a { color: #4d9fff; }
  </style>
</head>
<body>
  <header class="bar">
    <div class="brand"><span class="mark" aria-hidden="true">☁</span><span>UP2CLOUD AI Assistant</span></div>
    <a class="back" href="/">Back to UP2CLOUD</a>
  </header>
  <div class="fallback">
    <p>If the assistant does not load, <a href="https://up2cloud-ai-assistant.vercel.app">open it directly</a>.</p>
  </div>
  <iframe
    src="https://up2cloud-ai-assistant.vercel.app"
    title="UP2CLOUD AI Cloud Engineering Assistant"
    allow="clipboard-write"
    loading="eager"
  ></iframe>
</body>
</html>

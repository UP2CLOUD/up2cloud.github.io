      <text x="66" y="47" fill="#94A3B8" font-family="Helvetica" font-size="11">Clear totals and service-level breakdown</text>
      <path d="M321 30h9m-4-4 4 4-4 4" fill="none" stroke="#FB923C" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <rect x="760" y="490" width="344" height="34" rx="10" fill="#2563EB"/>
    <text x="932" y="512" text-anchor="middle" fill="#FFFFFF" font-family="Helvetica" font-size="13" font-weight="700">START EXPLORING</text>

  <rect width="1200" height="630" fill="url(#glow)"/>
  <circle cx="1092" cy="72" r="250" fill="none" stroke="#38BDF8" stroke-opacity="0.11"/>
  <circle cx="1092" cy="72" r="188" fill="none" stroke="#38BDF8" stroke-opacity="0.09"/>


<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">UP2CLOUD AI Cloud Engineering Assistant</title>
  <desc id="desc">Cloud guidance built for production, covering architecture, Terraform, FinOps, and security.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1200" y2="630" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.56" stop-color="#0B2341"/>
      <stop offset="1" stop-color="#075985"/>
    </linearGradient>
    <linearGradient id="headline" x1="72" y1="230" x2="680" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.56" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#FB923C"/>
    </linearGradient>
    <linearGradient id="panelLine" x1="744" y1="126" x2="1124" y2="544" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8" stop-opacity="0.7"/>
      <stop offset="0.48" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1010 120) rotate(120) scale(440 440)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#38BDF8" stroke-opacity="0.075"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#020617" flood-opacity="0.55"/>
    </filter>
  </defs>


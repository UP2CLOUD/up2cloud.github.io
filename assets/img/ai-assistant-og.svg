    <rect x="737" y="127" width="390" height="72" rx="24" fill="#0F1D31"/>
    <path d="M737 175H1127" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="760" y="146" width="34" height="34" rx="10" fill="#0369A1"/>
    <path d="M768 167a5 5 0 0 0 5 5h9a6 6 0 1 0-.2-12 7 7 0 0 0-13 2 5 5 0 0 0-.8 5Z" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="808" y="159" fill="#FFFFFF" font-family="Helvetica" font-size="15" font-weight="700">UP2CLOUD AI Assistant</text>

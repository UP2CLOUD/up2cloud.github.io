      <path d="M25 34h16M33 26v16" stroke="#38BDF8" stroke-width="2" stroke-linecap="round"/>
      <text x="66" y="28" fill="#FFFFFF" font-family="Helvetica" font-size="14" font-weight="700">AWS cost optimization plan</text>
      <text x="66" y="47" fill="#94A3B8" font-family="Helvetica" font-size="11">Quick wins, risk, and expected savings</text>
      <path d="M321 30h9m-4-4 4 4-4 4" fill="none" stroke="#38BDF8" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g transform="translate(760 328)">
      <rect width="344" height="66" rx="13" fill="#0D1B2D" stroke="#A78BFA" stroke-opacity="0.24"/>
      <rect x="14" y="14" width="38" height="38" rx="10" fill="#7C3AED" fill-opacity="0.13"/>
      <path d="m25 28-6 5 6 5m16-10 6 5-6 5m-5-15-6 20" fill="none" stroke="#C4B5FD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="66" y="28" fill="#FFFFFF" font-family="Helvetica" font-size="14" font-weight="700">Generate production Terraform</text>
      <text x="66" y="47" fill="#94A3B8" font-family="Helvetica" font-size="11">Secure modules with variables and outputs</text>
      <path d="M321 30h9m-4-4 4 4-4 4" fill="none" stroke="#A78BFA" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>


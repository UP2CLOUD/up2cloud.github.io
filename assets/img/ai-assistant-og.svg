  <text x="72" y="326" fill="url(#headline)" font-family="Helvetica" font-size="59" font-weight="700" letter-spacing="-2.5">Built for production.</text>
  <text x="72" y="378" fill="#CBD5E1" font-family="Helvetica" font-size="21">Ask questions, generate Terraform, estimate AWS costs,</text>
  <text x="72" y="407" fill="#CBD5E1" font-family="Helvetica" font-size="21">and explore secure cloud architecture patterns.</text>

